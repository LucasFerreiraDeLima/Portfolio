<header class="site-header">
  <div class="container header-inner">
    <a class="brand" [routerLink]="'home' | localizedRoute" [attr.aria-label]="'nav.homeAria' | t"><span class="brand-mark">LL</span><span>Lucas Lima</span></a>
    <nav [attr.aria-label]="'nav.main' | t">
      <a [routerLink]="'home' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.home' | t }}</a>
      <a [routerLink]="'about' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.about' | t }}</a>
      <a [routerLink]="'experience' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.experience' | t }}</a>
      <a [routerLink]="'projects' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.projects' | t }}</a>
      <a [routerLink]="'lab' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.lab' | t }}</a>
      <a class="nav-contact" [routerLink]="'contact' | localizedRoute" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.contact' | t }} <span aria-hidden="true">&#8599;</span></a>
    </nav>
    <button class="language-trigger" type="button" aria-haspopup="dialog" [attr.aria-expanded]="languageModalOpen" (click)="languageModalOpen = true"><span class="language-trigger-code">{{ i18n.language.toUpperCase() }}</span>{{ 'lang.open' | t }}</button>
  </div>
</header>

<div *ngIf="languageModalOpen" class="language-backdrop" (click)="languageModalOpen = false" (keydown.escape)="languageModalOpen = false" tabindex="-1">
  <section class="language-dialog" role="dialog" aria-modal="true" [attr.aria-label]="'lang.title' | t" (click)="$event.stopPropagation()">
    <button class="language-close" type="button" [attr.aria-label]="'lang.close' | t" (click)="languageModalOpen = false">×</button>
    <p class="eyebrow">{{ 'lang.open' | t }}</p><h2>{{ 'lang.title' | t }}</h2><p>{{ 'lang.description' | t }}</p>
    <div class="language-options">
      <button *ngFor="let language of languages" type="button" [class.selected]="i18n.language === language.id" [attr.aria-pressed]="i18n.language === language.id" (click)="selectLanguage(language.id)"><span>{{ language.flag }}</span>{{ language.key | t }}<b *ngIf="i18n.language === language.id" aria-hidden="true">✓</b></button>
    </div>
  </section>
</div>
